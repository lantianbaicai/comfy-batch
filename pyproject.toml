[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-batch"
version = "0.1.0"
description = "One-line ComfyUI Z-Image Turbo batch generation. pip install, then generate."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests"]
keywords = ["comfyui", "stable-diffusion", "z-image", "image-generation", "batch", "ai-art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/yunxi-ai/comfy-batch"
Repository = "https://github.com/yunxi-ai/comfy-batch"
